name: Deploy to S3

# Every push to main builds the Astro site and uploads it to the S3 bucket.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed for GitHub to sign in to AWS without stored passwords (OIDC).
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-s3
  cancel-in-progress: true

env:
  S3_BUCKET: agewell-website

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: DEBUG show sign-in claims
        run: |
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "$T" | cut -d. -f2 | python3 -c "import sys,base64,json;d=sys.stdin.read().strip();d+='='*(-len(d)%4);c=json.loads(base64.urlsafe_b64decode(d));print({k:c[k] for k in ('sub','aud','iss','repository','ref')})"

      # Signs in to AWS with the IAM role named github-agewell-deploy (no stored keys).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::408421298613:role/github-agewell-deploy
          aws-region: us-east-1

      # Files with a hash in the name never change, so browsers can keep them for a year.
      - name: Upload assets (long cache)
        run: |
          aws s3 sync dist "s3://${S3_BUCKET}" \
            --exclude "*.html" --exclude "sitemap*" --exclude "robots.txt" \
            --cache-control "public,max-age=31536000,immutable"

      # Pages are always re-checked so edits show up quickly.
      - name: Upload pages (short cache) and remove deleted files
        run: |
          aws s3 sync dist "s3://${S3_BUCKET}" \
            --exclude "*" --include "*.html" --include "sitemap*" --include "robots.txt" \
            --cache-control "public,max-age=0,must-revalidate"
          aws s3 sync dist "s3://${S3_BUCKET}" --delete --size-only
